[project]
name = "piperflow-agent"
version = "0.1.0"
description = "AI agent that generates BPMN process diagrams from plain English using ProcessPiper and Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]>=2.0",
    "processpiper>=0.8.1",
]

[project.scripts]
piperflow-agent = "piperflow.cli:main"
piperflow-validate = "piperflow.validate_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piperflow"]
